name: Recovery import 7465d6df

on:
  push:
    branches: [bundle-import-002a80ac]

permissions:
  contents: write
  issues: read

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_BUNDLE_SHA: 5ff78dfb3db4ea1484d2874dd0b531ae7d8ca5e2be4260ad635d949ac1cc7570
      EXPECTED_HEAD: 7465d6df28650da47369251849373a6a425f963b
      EXPECTED_PRESTATE: 002a80ac25752d4a79c18ef734cb4e54531fb436
      TARGET_BRANCH: source-reconstructed
      IMPORT_ISSUE: '2'
    steps:
      - name: Fetch and verify bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${IMPORT_ISSUE}")"
          url="$(printf '%s' "$issue_json" | python3 -c 'import json,sys; b=json.load(sys.stdin)["body"]; print(next(x for x in b.splitlines() if x.startswith("https://sdmnt")))')"
          test -n "$url"
          curl -fL --retry 2 --retry-delay 1 --max-time 90 "$url" -o /tmp/source.bundle
          echo "${EXPECTED_BUNDLE_SHA}  /tmp/source.bundle" | sha256sum -c -
          mkdir -p /tmp/verify
          git -C /tmp/verify init -q
          git -C /tmp/verify bundle verify /tmp/source.bundle
          git clone -q -b reconstruct-v1.3 /tmp/source.bundle /tmp/source
          test "$(git -C /tmp/source rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git -C /tmp/source status --porcelain)"
      - name: Verify target prestate and publish exact history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          before="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$before" = "$EXPECTED_PRESTATE"
          git -C /tmp/source remote set-url origin "$remote"
          git -C /tmp/source push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_PRESTATE}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          after="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$after" = "$EXPECTED_HEAD"
