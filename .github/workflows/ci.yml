name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run check:ts
      - run: npm run check:wrangler
      - run: pytest -q
      - run: python3 scripts/validate_invariants.py
      - name: Run exact-head Gate evidence
        run: |
          export FARE_EVIDENCE_ROOT="$RUNNER_TEMP/fare-evidence"
          npm run gates:all
      - name: Upload Gate evidence
        id: gate_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/fare-evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: Build compact release evidence manifest
        if: success()
        env:
          FARE_EVIDENCE_ROOT: ${{ runner.temp }}/fare-evidence
          FARE_MANIFEST_ROOT: ${{ runner.temp }}/fare-release-manifest
          GATE_ARTIFACT_ID: ${{ steps.gate_upload.outputs.artifact-id }}
          GATE_ARTIFACT_DIGEST: ${{ steps.gate_upload.outputs.artifact-digest }}
          GATE_ARTIFACT_URL: ${{ steps.gate_upload.outputs.artifact-url }}
        run: python3 scripts/release_evidence_manifest.py
      - name: Upload compact release evidence manifest
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/fare-release-manifest/release-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90


  attest-evidence:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download compact release evidence manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/fare-release-manifest
      - name: Attest release evidence provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/fare-release-manifest/release-evidence-manifest.json
