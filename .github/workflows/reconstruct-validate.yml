name: Reconstruct validate
on:
  push:
    branches: [main]
    paths: [validation/request.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact reconstructed head
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(jq -r .expected_head validation/request.json)
          test "$TARGET" != "null"
          git fetch origin refs/heads/reconstruct-v1.3:refs/remotes/origin/reconstruct-v1.3
          test "$(git rev-parse origin/reconstruct-v1.3)" = "$TARGET"
          git checkout --detach "$TARGET"
          test "$(git rev-parse HEAD)" = "$TARGET"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run check:ts
      - run: npm run check:wrangler
      - run: pytest -q
      - run: python3 scripts/validate_invariants.py
      - run: git diff --check
